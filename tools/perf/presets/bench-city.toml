# The career city bench's graphics settings, applied as command-line overrides by
# tools/perf/play_preset.sh, so your native.toml is untouched.
#
#   tools/perf/play_preset.sh bench-city --gta4_metal_api=metal3
#   tools/perf/play_preset.sh bench-city --gta4_metal_api=metal4
#
# This is the route in tools/perf/route_bench.sh pad career-street tools/perf/pads/city-drive.pad:
# 1440p output, MetalFX performance upscaling (1280x720 -> 2560x1440) with MetalFX TAA, frame
# generation off, uncapped/immediate presentation, the console's world/population/reflection
# values, and the conservative Metal 4 proxy defaults. Override any of them after the preset name
# (the later flag wins), e.g.:
#   tools/perf/play_preset.sh bench-city --gta4_metal_api=metal4 \
#       --gta4_metal4_residency=persistent --gta4_metal4_render_barrier=tracked \
#       --gta4_metal4_lean_tracking=true

resolution = "1440p"
gta4_native_upscaler = "metalfx"
gta4_fsr1_quality = "performance"
gta4_native_anti_aliasing = "metalfx_taa"
gta4_metalfx_frame_generation = false
gta4_frame_limit = 0
gta4_present_mode = "immediate"
gta4_native_hdr_mode = "scrgb"
gta4_reflection_resolution = "1080p"
gta4_reflection_aa = "4x"
gta4_modern_shaders = false
gta4_draw_distance_scale = 1.0
gta4_shadow_distance_scale = 1.0
gta4_ped_density_scale = 1.0
gta4_traffic_density_scale = 1.0
gta4_parked_car_density_scale = 1.0
gta4_scenario_ped_density_scale = 1.0
gta4_streaming_budget_scale = 1.0
gta4_metal4_residency = "frame"
gta4_metal4_render_barrier = "full"
gta4_metal4_lean_tracking = false
